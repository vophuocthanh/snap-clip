name: CI 🐼

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  build-and-test:
    name: 🧪 Build & Test
    runs-on: macos-15
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🏗️ Build
        run: swift build --configuration release

      - name: 🧪 Run tests
        run: swift test --configuration release

  lint:
    name: 🔍 Lint
    runs-on: macos-15
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🍺 Install SwiftLint
        run: brew install swiftlint

      - name: 🔍 Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging --strict Sources/
